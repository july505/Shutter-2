name: Compilar APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Preparar Java y dependencias
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-venv git zip unzip openjdk-17-jdk

      - name: Instalar Buildozer
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer cython

      - name: Compilar APK
        run: buildozer android debug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: ControlVentas-APK
          path: bin/*.apk
